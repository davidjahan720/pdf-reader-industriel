<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extracteur de cotes — Plans industriels</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #1e1e2e; color: #cdd6f4; min-height: 100vh; }

  header { background: #2a2a3e; padding: 14px 24px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #313244; }
  header h1 { font-size: 1.1rem; font-weight: 600; }
  .badge { background: #7c6af7; color: #fff; font-size: 0.7rem; padding: 2px 8px; border-radius: 99px; }
  .gpu-badge { background: #a6e3a1; color: #1e1e2e; font-size: 0.7rem; padding: 2px 8px; border-radius: 99px; }

  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; display: grid; grid-template-columns: 1fr 420px; gap: 16px; }

  .panel { background: #2a2a3e; border-radius: 10px; padding: 20px; }
  .panel h2 { font-size: 0.85rem; color: #6c7086; font-weight: 600; margin-bottom: 14px; text-transform: uppercase; letter-spacing: .05em; }

  .drop-zone { border: 2px dashed #45475a; border-radius: 8px; padding: 40px 20px; text-align: center; cursor: pointer; transition: border-color .2s; }
  .drop-zone:hover, .drop-zone.dragover { border-color: #7c6af7; }
  .drop-zone p { color: #6c7086; font-size: .9rem; margin-top: 8px; }
  .drop-zone input { display: none; }
  .file-name { margin-top: 10px; font-size: .85rem; color: #89b4fa; min-height: 1.2em; }

  .btn { display: inline-flex; align-items: center; gap: 6px; border: none; border-radius: 6px; padding: 9px 18px; font-size: .9rem; font-weight: 500; cursor: pointer; transition: opacity .15s; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-primary  { background: #7c6af7; color: #fff; }
  .btn-success  { background: #a6e3a1; color: #1e1e2e; }
  .btn-danger   { background: #f38ba8; color: #1e1e2e; }
  .btn-sm       { padding: 5px 12px; font-size: .8rem; }

  .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }

  .excel-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .excel-row input[type=file] { display: none; }
  .excel-label { font-size: .82rem; color: #6c7086; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #status { margin-top: 12px; font-size: .82rem; color: #6c7086; min-height: 1.2em; }
  #status.error { color: #f38ba8; }
  #status.ok    { color: #a6e3a1; }

  .spinner { display: none; width: 18px; height: 18px; border: 2px solid #45475a; border-top-color: #7c6af7; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  th { text-align: left; padding: 6px 10px; color: #6c7086; font-weight: 600; font-size: .78rem; text-transform: uppercase; border-bottom: 1px solid #313244; }
  td { padding: 6px 10px; border-bottom: 1px solid #1e1e2e; }
  tr:last-child td { border-bottom: none; }
  tr.dim      td:nth-child(2) { color: #cdd6f4; }
  tr.iso_fit  td:nth-child(2) { color: #89b4fa; }
  tr.rayon    td:nth-child(2) { color: #f9e2af; }
  tr.angle    td:nth-child(2) { color: #f9e2af; }
  tr.rugosite td:nth-child(2) { color: #fab387; }
  tr.gdt      td:nth-child(2) { color: #a6e3a1; }

  .count-badge { font-size: .8rem; color: #7c6af7; float: right; }
  .table-wrap  { max-height: 520px; overflow-y: auto; margin-top: 4px; }
  .empty-msg   { color: #45475a; font-size: .9rem; padding: 20px 0; text-align: center; }
</style>
</head>
<body>

<header>
  <h1>📐 Extracteur de cotes — Plans industriels</h1>
  <span class="badge">v2.0</span>
  <span class="gpu-badge" id="gpu-badge">chargement…</span>
</header>

<main>
  <!-- Panneau gauche : upload + actions -->
  <div>
    <div class="panel">
      <h2>Plan à analyser</h2>
      <div class="drop-zone" id="drop-zone" onclick="document.getElementById('plan-input').click()">
        <svg width="32" height="32" fill="none" stroke="#45475a" stroke-width="1.5" viewBox="0 0 24 24"><path d="M12 16V8m0 0-3 3m3-3 3 3"/><rect x="3" y="3" width="18" height="18" rx="3"/></svg>
        <p>Glisser-déposer ou cliquer</p>
        <p style="font-size:.75rem;margin-top:4px">PDF · DXF · PNG · JPG · TIFF</p>
        <input type="file" id="plan-input" accept=".pdf,.dxf,.png,.jpg,.jpeg,.tif,.tiff,.bmp,.webp">
      </div>
      <div class="file-name" id="plan-name">Aucun fichier sélectionné</div>

      <div class="actions">
        <button class="btn btn-primary" id="btn-analyze" disabled>
          <span class="spinner" id="spinner"></span>
          ⚡ Analyser
        </button>
        <button class="btn btn-danger btn-sm" id="btn-clear">🗑 Vider</button>
      </div>
      <div id="status">Prêt — chargez un plan</div>
    </div>

    <div class="panel" style="margin-top:16px">
      <h2>Export Excel</h2>
      <div class="excel-row">
        <button class="btn btn-sm" style="background:#45475a;color:#cdd6f4" onclick="document.getElementById('excel-input').click()">
          📂 PV de contrôle (.xls)
        </button>
        <input type="file" id="excel-input" accept=".xls,.xlsx">
        <span class="excel-label" id="excel-name">Aucun fichier</span>
      </div>
      <div class="actions" style="margin-top:10px">
        <button class="btn btn-success" id="btn-export" disabled>💾 Exporter</button>
      </div>
    </div>
  </div>

  <!-- Panneau droit : résultats -->
  <div class="panel">
    <h2>Cotes extraites <span class="count-badge" id="count-badge"></span></h2>
    <div class="table-wrap">
      <table id="results-table">
        <thead><tr><th>#</th><th>Cote</th><th>Type</th></tr></thead>
        <tbody id="results-body">
          <tr><td colspan="3" class="empty-msg">Aucune cote extraite</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script>
let planFile = null, excelFile = null, items = [];

// GPU badge
fetch('/info').then(r=>r.json()).then(d=>{
  const b = document.getElementById('gpu-badge');
  b.textContent = d.gpu ? 'GPU ' + d.gpu_name : 'CPU';
  b.style.background = d.gpu ? '#a6e3a1' : '#f9e2af';
  b.style.color = '#1e1e2e';
}).catch(()=>{});

// Drop zone
const dz = document.getElementById('drop-zone');
dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.classList.add('dragover'); });
dz.addEventListener('dragleave', ()=>dz.classList.remove('dragover'));
dz.addEventListener('drop', e=>{ e.preventDefault(); dz.classList.remove('dragover'); setPlan(e.dataTransfer.files[0]); });
document.getElementById('plan-input').addEventListener('change', e=>setPlan(e.target.files[0]));
document.getElementById('excel-input').addEventListener('change', e=>setExcel(e.target.files[0]));

function setPlan(f) {
  if (!f) return;
  planFile = f;
  document.getElementById('plan-name').textContent = f.name;
  document.getElementById('btn-analyze').disabled = false;
  setStatus('Fichier chargé : ' + f.name);
}
function setExcel(f) {
  if (!f) return;
  excelFile = f;
  document.getElementById('excel-name').textContent = f.name;
}
function setStatus(msg, type='') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = type;
}

// Analyser
document.getElementById('btn-analyze').addEventListener('click', async ()=>{
  if (!planFile) return;
  const spinner = document.getElementById('spinner');
  spinner.style.display = 'inline-block';
  document.getElementById('btn-analyze').disabled = true;
  setStatus('Analyse en cours…');

  const fd = new FormData();
  fd.append('file', planFile);

  try {
    const res  = await fetch('/analyze', { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Erreur serveur');
    items = data.items;
    renderTable(items);
    setStatus(`Extraction ${data.source} : ${data.count} éléments`, 'ok');
    document.getElementById('btn-export').disabled = items.length === 0;
  } catch(e) {
    setStatus(e.message, 'error');
  } finally {
    spinner.style.display = 'none';
    document.getElementById('btn-analyze').disabled = false;
  }
});

// Vider
document.getElementById('btn-clear').addEventListener('click', ()=>{
  items = [];
  planFile = null;
  document.getElementById('plan-name').textContent = 'Aucun fichier sélectionné';
  document.getElementById('btn-analyze').disabled = true;
  document.getElementById('btn-export').disabled = true;
  renderTable([]);
  setStatus('Liste vidée');
});

// Exporter
document.getElementById('btn-export').addEventListener('click', async ()=>{
  if (!excelFile) { setStatus('Sélectionnez d\'abord le fichier PV de contrôle', 'error'); return; }
  if (!planFile)  { setStatus('Aucun plan chargé', 'error'); return; }
  setStatus('Export en cours…');
  const fd = new FormData();
  fd.append('plan',  planFile);
  fd.append('excel', excelFile);
  try {
    const res = await fetch('/export', { method: 'POST', body: fd });
    if (!res.ok) { const d = await res.json(); throw new Error(d.detail); }
    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = excelFile.name.replace('.xls', '_rempli.xls');
    a.click(); URL.revokeObjectURL(url);
    setStatus('Export réussi — fichier téléchargé', 'ok');
  } catch(e) { setStatus(e.message, 'error'); }
});

// Rendu tableau
function renderTable(items) {
  const tbody = document.getElementById('results-body');
  const badge = document.getElementById('count-badge');
  if (!items.length) {
    tbody.innerHTML = '<tr><td colspan="3" class="empty-msg">Aucune cote extraite</td></tr>';
    badge.textContent = '';
    return;
  }
  const ndim = items.filter(i=>i.type!=='gdt').length;
  const ngdt = items.filter(i=>i.type==='gdt').length;
  badge.textContent = `${ndim} cotes · ${ngdt} GD&T`;
  tbody.innerHTML = items.map((it, i)=>`
    <tr class="${it.type}">
      <td>${i+1}</td>
      <td>${it.label}</td>
      <td>${it.type}</td>
    </tr>`).join('');
}
</script>
</body>
</html>
